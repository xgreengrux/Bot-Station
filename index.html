<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="Bot Station - an online social-deduction party game for 4-10 players. One of you is a saboteur.">
<title>Bot Station</title>
<style>
:root{--bg:#070a14;--p1:#101830;--p2:#18223f;--bd:#2a3660;--tx:#e8ecf8;--mu:#8e9acb;--ac:#38bdf8;--ac2:#818cf8;--bad:#ef4444;--ok:#22c55e;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.hidden{display:none!important}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.screen{position:fixed;inset:0;overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{background:rgba(16,24,48,.92);border:1px solid var(--bd);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
.title-card{width:min(440px,100%);text-align:center}
.logo{font-size:2.6rem;font-weight:900;letter-spacing:.14em;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.tag{color:var(--mu);margin:0 0 18px;line-height:1.45}
.inp{width:100%;background:#0b1126;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:12px 14px;font:inherit;font-size:1rem;outline:none;margin-bottom:10px}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(56,189,248,.2)}
.inp.code{text-align:center;letter-spacing:.4em;font-weight:800;text-transform:uppercase;margin:0}
.btn{font:inherit;font-weight:700;border:1px solid var(--bd);background:var(--p2);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;transition:.12s}
.btn:hover:not(:disabled){background:#222f57;border-color:#3b4a80}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:13px 20px;font-size:1.05rem}
.btn.primary{background:linear-gradient(135deg,#0ea5e9,#6366f1);border:0;color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.35)}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.btn.danger{background:#3a1520;border-color:#6b2232}
.btn.sel{outline:2px solid var(--ac)}
#tCreate{width:100%}
.or{color:var(--mu);margin:14px 0 10px;font-size:.85rem;display:flex;align-items:center;gap:10px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.msg{min-height:1.4em;margin-top:12px;color:var(--mu);font-size:.9rem}
.msg.err{color:#fca5a5}
.how{margin-top:14px;text-align:left;color:var(--mu);font-size:.86rem}
.how summary{cursor:pointer;color:var(--ac)}
.how p{margin:.5em 0;line-height:1.4}

/* lobby */
#lobby{justify-content:flex-start;gap:14px;background:rgba(7,10,20,.55)}
.lb-top{width:min(1100px,100%);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lb-label{font-size:.72rem;letter-spacing:.16em;color:var(--mu);margin:10px 0 6px}
.lb-top .lb-label{margin:0}
.lb-code{font:inherit;font-size:2.6rem;font-weight:900;letter-spacing:.3em;color:var(--ac);background:none;border:0;cursor:pointer;padding:0}
.lb-actions{display:flex;gap:8px}
.lb-main{width:min(1100px,100%);display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.panel-s{background:rgba(16,24,48,.92);border:1px solid var(--bd);border-radius:16px;padding:16px;min-width:0}
.panel-s h3{margin:0 0 10px;font-size:.8rem;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pcard{position:relative;background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:8px 6px;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pcard.empty{opacity:.35;border-style:dashed;font-size:.8rem;color:var(--mu)}
.pcard.off{opacity:.5}
.pn{font-weight:700;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{color:var(--mu);font-weight:400}
.crown{position:absolute;top:4px;left:6px;font-size:1rem}
.kick{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:#3a1520;color:#fca5a5;cursor:pointer;font-size:.75rem;line-height:1}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.sw.taken{opacity:.2;cursor:not-allowed}
.hats{display:flex;flex-wrap:wrap;gap:6px}
.hatb{font:inherit;font-size:.78rem;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--p2);color:var(--tx);cursor:pointer}
.hatb.sel{border-color:var(--ac);background:#14304a}
.settings{display:flex;flex-direction:column;gap:3px;max-height:340px;overflow:auto;padding-right:4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.86rem;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.sctl{display:flex;align-items:center;gap:6px}
.sctl b{min-width:44px;text-align:center}
.mini{font:inherit;font-weight:800;width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);background:var(--p2);color:var(--tx);cursor:pointer;padding:0}
.mini:disabled{opacity:.35;cursor:default}
.mini.tog,.mini.wide{width:auto;padding:0 10px;font-size:.78rem}
.mini.tog.on{background:#12432a;border-color:#1d6b42}
.chatpanel{grid-column:1/-1}
.chatbox{display:flex;flex-direction:column;gap:8px;min-height:0}
.chatlog{height:130px;overflow:auto;background:#0b1126;border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:.88rem;-webkit-user-select:text;user-select:text}
.chatmsg{padding:1px 0;word-break:break-word}
.chatmsg.ghost{opacity:.75;font-style:italic}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;background:#0b1126;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;outline:none}
.lb-foot{width:min(1100px,100%);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lb-note{color:var(--mu)}
.countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:12rem;font-weight:900;color:#fff;text-shadow:0 0 60px var(--ac2);background:rgba(7,10,20,.6);pointer-events:none;z-index:30}

/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:none}
#hud button,#hud input,#hud .chatlog,#hud form{pointer-events:auto}
#hudtop{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:10px;align-items:flex-start}
#tasks{background:rgba(10,16,34,.82);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:200px;max-width:280px;font-size:.82rem}
.th{font-weight:800;letter-spacing:.06em;margin-bottom:5px;color:var(--ac);font-size:.74rem;text-transform:uppercase}
.th.bad{color:var(--bad)}
.tl{padding:3px 0;display:flex;flex-direction:column}
.tl small{color:var(--mu);font-size:.72rem}
.tl.done span{text-decoration:line-through;opacity:.5}
#tbar{flex:1;max-width:520px;margin:0 auto;position:relative;height:24px;border-radius:12px;background:rgba(10,16,34,.85);border:1px solid var(--bd);overflow:hidden}
#tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .5s}
#tbarTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;letter-spacing:.08em}
.hbtn.small{position:static;width:auto;height:auto;padding:6px 10px;font-size:1rem;border-radius:10px;background:rgba(10,16,34,.85);border:1px solid var(--bd);color:#fff;cursor:pointer;pointer-events:auto;margin-left:auto}
#alert{position:absolute;top:48px;left:50%;transform:translateX(-50%);max-width:min(720px,94vw);text-align:center;background:rgba(40,12,16,.92);border:1px solid #7f1d1d;color:#fecaca;padding:8px 16px;border-radius:12px;font-weight:700;font-size:.9rem}
#alert.crit{animation:blink .7s infinite alternate;background:rgba(90,10,16,.95)}
@keyframes blink{to{background:rgba(160,20,28,.95)}}
#btns{position:absolute;right:14px;bottom:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:min(700px,94vw)}
.hbtn{font:inherit;font-weight:800;letter-spacing:.04em;min-width:96px;height:64px;border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(18,26,52,.92);color:#fff;cursor:pointer;font-size:.8rem;padding:0 12px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.hbtn:disabled{opacity:.35;cursor:not-allowed}
#bUse{background:linear-gradient(135deg,#0e7490,#0369a1)}
#bKill{background:linear-gradient(135deg,#b91c1c,#7f1d1d)}
#bReport{background:linear-gradient(135deg,#b45309,#92400e)}
#bVent{background:linear-gradient(135deg,#6d28d9,#4c1d95)}
#bSab{background:linear-gradient(135deg,#be123c,#881337)}
#ventbar{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(10,16,34,.92);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
#ventbar .btn{pointer-events:auto}
#ghostchat{position:absolute;left:12px;bottom:12px;width:min(340px,60vw)}
#ghostchat .chatlog{height:90px;background:rgba(10,16,34,.8)}
#hud.dead #tasks .th{color:#93c5fd}
#toast{position:fixed;top:92px;left:50%;transform:translate(-50%,-12px);background:rgba(10,16,34,.95);border:1px solid var(--bd);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:80;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#conn{position:fixed;inset:0;background:rgba(5,8,18,.82);z-index:90;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(5,8,18,.72)}
.pcard2,.map-card{background:#101830;border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);max-width:96vw;max-height:94vh;overflow:auto}
.pcard2{width:min(420px,100%)}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:1rem}
.x{background:none;border:0;color:var(--mu);font-size:1.2rem;cursor:pointer;pointer-events:auto}
.pbody{display:flex;flex-direction:column;align-items:center;gap:12px;transition:.3s}
.pbody.solved{filter:hue-rotate(80deg) brightness(1.2);opacity:.6}
.phint{text-align:center;color:var(--mu);font-size:.85rem;margin-top:10px}
.map-card{width:min(900px,100%,calc((100vh - 120px) * 1.176))}
.mapwrap{position:relative;line-height:0}
.mapwrap canvas{width:100%;height:auto;border-radius:12px;background:#070a14}
.mapbtns{position:absolute;inset:0}
.sabbtn{position:absolute;transform:translate(-50%,-50%);font:inherit;font-weight:800;font-size:.8rem;line-height:1.2;padding:8px 12px;border-radius:10px;border:2px solid #fecaca;background:#991b1b;color:#fff;cursor:pointer}
.sabbtn.door{background:#334155;border-color:#94a3b8;font-size:.72rem;padding:5px 9px}
.sabbtn:disabled{opacity:.4;cursor:not-allowed}

/* mini games */
.mg-big{font-size:2.2rem;font-weight:900;letter-spacing:.3em;font-family:ui-monospace,monospace;color:var(--ac)}
.mg-disp{min-height:1.6em;text-align:center;font-weight:700;color:var(--mu);letter-spacing:.05em}
.mg-disp.ok{color:var(--ok)}.mg-disp.bad{color:var(--bad)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.key{font:inherit;font-weight:800;font-size:1.2rem;height:52px;border-radius:10px;border:1px solid var(--bd);background:var(--p2);color:#fff;cursor:pointer}
svg.wires{width:100%;max-width:340px;touch-action:none}
.slrow{width:100%;display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--mu)}
.sltrack{position:relative;height:34px}
.sltrack input{position:absolute;inset:0;width:100%;margin:0;background:none;z-index:2}
.slband{position:absolute;top:8px;height:18px;border-radius:6px;background:rgba(251,191,36,.4);border:2px solid var(--warn);z-index:1}
.slband.good{background:rgba(34,197,94,.5);border-color:var(--ok)}
.caltrack{position:relative;width:100%;height:40px;background:#0b1126;border:1px solid var(--bd);border-radius:10px}
.calzone{position:absolute;top:0;bottom:0;background:rgba(34,197,94,.35);border:2px solid var(--ok);border-radius:8px}
.calmark{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:#fff;border-radius:3px}
.leaffield{position:relative;width:300px;height:230px;background:#10331f;border:2px solid #1f6b3e;border-radius:14px;overflow:hidden}
.leaf{position:absolute;font-size:2rem;cursor:pointer;transition:.3s;touch-action:none}
.seqgrid{display:grid;grid-template-columns:repeat(3,70px);gap:8px}
.seqtile{height:70px;border-radius:12px;border:1px solid var(--bd);background:#1a2548;cursor:pointer}
.seqtile.lit{background:#38bdf8;box-shadow:0 0 22px #38bdf8}
.tcv{width:100%;max-width:340px;border-radius:12px;border:1px solid var(--bd);touch-action:none;cursor:crosshair}
.pgrid{display:grid;grid-template-columns:repeat(4,64px);gap:8px}
.pnl{height:64px;border-radius:10px;border:2px solid #3b4a80;background:#1a2548;cursor:pointer}
.pnl.bad{background:#b91c1c;border-color:#fca5a5}
.pnl.good{background:#15803d;border-color:#86efac}
.leverslot{position:relative;width:60px;height:210px;background:#0b1126;border:2px solid var(--bd);border-radius:30px}
.leverknob{position:absolute;left:4px;top:0;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#991b1b);cursor:grab;touch-action:none;border:2px solid #fff3}
.bigtoggle{font:inherit;font-weight:900;font-size:1.4rem;width:150px;height:80px;border-radius:40px;border:3px solid var(--bd);background:#1a2548;color:#fff;cursor:pointer}
.bigtoggle.on{background:#15803d;border-color:#86efac}
.swrow{display:flex;gap:10px}
.swbtn{font:inherit;font-weight:800;width:54px;height:92px;border-radius:12px;border:2px solid var(--bd);background:#1a2548;color:var(--mu);cursor:pointer}
.swbtn.on{background:#854d0e;border-color:var(--warn);color:#fff}
.holdbar{width:100%;height:22px;border-radius:11px;background:#0b1126;border:1px solid var(--bd);overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#6366f1)}
.holdbtn.on{background:#15803d;border-color:#86efac}

/* meeting */
#meeting{background:rgba(5,8,18,.9)}
.meet-card{width:min(1000px,100%);max-height:96vh;display:flex;flex-direction:column;gap:12px;padding:18px;background:#0e1530;border:1px solid var(--bd);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:auto}
.meet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.meet-head h2{margin:0}.meet-head p{margin:4px 0 0;color:var(--mu)}
.meet-timer{font-size:2rem;font-weight:900;color:var(--warn)}
.meet-body{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;min-height:0}
.meet-players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.mcard{position:relative;display:flex;align-items:center;gap:8px;background:var(--p2);border:2px solid var(--bd);border-radius:12px;padding:8px 10px;color:var(--tx);font:inherit;text-align:left;cursor:default;min-width:0;flex-wrap:wrap}
button.mcard{cursor:pointer}button.mcard:hover{border-color:var(--ac)}
.mcard.sel{border-color:var(--warn);background:#2b2410}
.mcard.dead{opacity:.45}
.mcard.ejected{border-color:var(--bad);background:#2a1016}
.mn{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.mn small{color:var(--mu);font-weight:400}
.mbadge{position:absolute;top:2px;right:6px;font-size:.9rem}
.mbadge.voted{color:var(--ok);font-weight:900}
.mcard .off{color:var(--mu);width:100%}
.vdots{display:flex;gap:3px;flex-wrap:wrap;width:100%}
.vdots i{width:14px;height:14px;border-radius:50%;border:2px solid #0008;display:block}
.vcount{width:100%;font-weight:800;color:var(--warn)}
.meet-chat .chatlog{height:min(36vh,300px)}
.meet-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px}
.confirm{display:flex;align-items:center;gap:8px}
.mstatus{color:var(--mu);font-size:.88rem}
.skipcount{margin-left:10px;color:var(--warn);font-weight:700}

/* eject / intro / over */
#eject{padding:0;background:#02030a;z-index:40}
#ecv{position:absolute;inset:0;width:100%;height:100%}
#etext{position:relative;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:34vh;text-align:center}
.eline{font-size:clamp(1.3rem,4vw,2.4rem);font-weight:800;text-shadow:0 2px 20px #000;animation:fadein .6s both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
#intro{z-index:35;flex-direction:column;gap:14px;background:radial-gradient(circle,#10214a 0,#03050d 75%)}
.role-title{font-size:clamp(2.6rem,9vw,5.5rem);font-weight:900;letter-spacing:.12em;animation:pop .6s both}
.role-title.imp{color:#ff4d5a;text-shadow:0 0 40px #b91c1c}
.role-title.crew{color:#7dd3fc;text-shadow:0 0 40px #0369a1}
@keyframes pop{from{opacity:0;transform:scale(1.6)}}
.role-sub{font-size:1.2rem;color:var(--mu);text-align:center}
.role-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:10px;max-width:700px}
.role-bot{display:flex;flex-direction:column;align-items:center;font-size:.8rem;animation:fadein .5s both}
#killov{z-index:45;flex-direction:column;background:rgba(120,0,10,.75);pointer-events:none}
.kill-t{font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:.1em;animation:pop .4s both}
.kill-s{font-size:1.1rem;margin-top:8px}
#over{z-index:50;background:rgba(3,5,12,.88)}
.over-card{background:#101830;border:1px solid var(--bd);border-radius:20px;padding:26px;width:min(760px,100%);text-align:center}
.over-t{font-size:clamp(2.4rem,8vw,4.4rem);font-weight:900;letter-spacing:.14em}
.over-t.win{color:#4ade80}.over-t.lose{color:#f87171}
.over-s{color:var(--mu);margin:6px 0 16px}
.over-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:18px}
.obot{display:flex;flex-direction:column;align-items:center;font-size:.8rem;min-width:84px;padding:8px;border-radius:12px;border:1px solid var(--bd)}
.obot.imp{border-color:#7f1d1d;background:#2a1016}
.obot small{color:var(--mu)}
.over-foot{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}

#btns .hbtn.small{min-width:48px;width:48px;height:48px;padding:0;font-size:1.1rem;margin:0;align-self:end}
#tasks .th{cursor:pointer}
@media (max-width:820px){
  .lb-main{grid-template-columns:1fr}
  .meet-body{grid-template-columns:1fr}
  .logo{font-size:2rem}
  .lb-code{font-size:2rem}
  #hudtop{flex-direction:column;gap:6px;left:8px;right:8px;top:8px}
  #tbar{order:-1;flex:none;max-width:none;width:100%;margin:0;height:22px}
  #tbarTxt{font-size:.64rem;white-space:nowrap}
  #tasks{max-width:none;width:100%;min-width:0;font-size:.72rem;padding:6px 10px}
  #tasks .th:after{content:" ▾";color:var(--mu)}
  #tasks.collapsed .th:after{content:" ▸"}
  #tasks.collapsed .tl{display:none}
  #alert{top:84px;font-size:.78rem;padding:6px 10px}
  #toast{top:112px}
  #btns{display:grid;grid-template-columns:repeat(4,auto);gap:8px;right:8px;bottom:10px;max-width:none}
  .hbtn{min-width:70px;height:50px;font-size:.66rem;padding:0 6px;border-radius:12px;letter-spacing:0}
  #ventbar{bottom:132px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  #ghostchat{bottom:10px;width:min(240px,50vw)}
